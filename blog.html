<p>
<!--Posts below are written and hosted on <a href="https://mptouzel.leaflet.pub/">Leaflet</a> and published as <a href="https://standard.site/">standard.site</a> records on the AT Protocol — this page just reads those public records and lists them here.-->
Click a title to read it right here. You can also subscribe via <a href="https://mptouzel.leaflet.pub/rss">RSS</a>.
</p>

<div id="blog-status">Loading posts…</div>
<div id="blog-posts"></div>

<script>
(async function () {
  const DID = "did:plc:54ehcijq3tcvfhvzavg2aqdx";
  const PUB_RKEY = "3mlthqqntx223";
  const PUB_COLLECTION = "site.standard.publication";
  const DOC_COLLECTION = "site.standard.document";

  const statusEl = document.getElementById("blog-status");
  const postsEl = document.getElementById("blog-posts");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  async function resolvePDS(did) {
    const res = await fetch("https://plc.directory/" + encodeURIComponent(did));
    if (!res.ok) throw new Error("Could not resolve DID document (" + res.status + ")");
    const doc = await res.json();
    const svc = (doc.service || []).find(function (s) {
      return s.id === "#atproto_pds";
    });
    if (!svc) throw new Error("No PDS service endpoint in DID document");
    return svc.serviceEndpoint;
  }

  // Render plain textContent as paragraphs. Leaflet posts are block-based, so
  // this plain-text field (when present) is a flattened, formatting-free copy
  // of the post -- good enough for reading inline, but images/embeds/code
  // formatting from the original won't appear here.
  function renderTextContent(text) {
    return text
      .split(/\n{2,}/)
      .map(function (para) {
        return "<p>" + escapeHtml(para.trim()).replace(/\n/g, "<br>") + "</p>";
      })
      .join("");
  }

  function renderPost(post, idx) {
    const url = (post.baseUrl || "") + (post.path || "");
    const title = escapeHtml(post.title || "Untitled");
    const description = post.description ? "<p>" + escapeHtml(post.description) + "</p>" : "";
    const tags = (post.tags && post.tags.length)
      ? '<div class="post-tags">' + post.tags.map(escapeHtml).join(" · ") + "</div>"
      : "";
    const bodyId = "post-body-" + idx;

    // Decide, up front, how this post will render when expanded: full plain
    // text if the record carries it, otherwise an embedded view of the
    // Leaflet page itself.
    const hasText = post.textContent && post.textContent.trim().length > 40;
    const bodyContent = hasText
      ? renderTextContent(post.textContent)
      : (
          '<iframe src="' + url + '" loading="lazy" title="' + title + '"></iframe>' +
          '<div class="iframe-note">Showing the live Leaflet post above. If it doesn\'t load, ' +
          '<a href="' + url + '" target="_blank" rel="noopener">open it in a new tab</a> instead.</div>'
        );

    return (
      '<div class="post-card">' +
        '<h1><a class="post-title-link" onclick="togglePost(\'' + bodyId + '\'); return false;" href="' + url + '">' + title + "</a></h1>" +
        '<div class="post-date">' + formatDate(post.publishedAt) + "</div>" +
        description +
        tags +
        '<div><a class="post-open-link" href="' + url + '" target="_blank" rel="noopener">open on Leaflet ↗</a></div>' +
        '<div class="post-body" id="' + bodyId + '">' + bodyContent + "</div>" +
      "</div>"
    );
  }

  window.togglePost = function (id) {
    const el = document.getElementById(id);
    if (!el) return;
    const isOpen = el.classList.contains("open");
    // collapse any other open post first, so only one reads at a time
    document.querySelectorAll(".post-body.open").forEach(function (o) {
      if (o.id !== id) o.classList.remove("open");
    });
    el.classList.toggle("open", !isOpen);
    if (!isOpen) {
      el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  };

  try {
    const pds = await resolvePDS(DID);

    const pubRes = await fetch(
      pds + "/xrpc/com.atproto.repo.getRecord?repo=" + encodeURIComponent(DID) +
      "&collection=" + PUB_COLLECTION + "&rkey=" + PUB_RKEY
    );
    if (!pubRes.ok) throw new Error("Could not fetch publication record (" + pubRes.status + ")");
    const pubData = await pubRes.json();
    const baseUrl = (pubData.value && pubData.value.url) || "https://mptouzel.leaflet.pub";

    const docsRes = await fetch(
      pds + "/xrpc/com.atproto.repo.listRecords?repo=" + encodeURIComponent(DID) +
      "&collection=" + DOC_COLLECTION + "&limit=50"
    );
    if (!docsRes.ok) throw new Error("Could not list document records (" + docsRes.status + ")");
    const docsData = await docsRes.json();

    const posts = (docsData.records || [])
      .map(function (r) {
        const v = r.value || {};
        v.baseUrl = baseUrl;
        return v;
      })
      .sort(function (a, b) {
        return new Date(b.publishedAt || 0) - new Date(a.publishedAt || 0);
      });

    if (!posts.length) {
      statusEl.textContent = "No posts found yet.";
    } else {
      statusEl.remove();
      postsEl.innerHTML = posts.map(function (p, i) { return renderPost(p, i); }).join("");
    }
  } catch (err) {
    console.error("Failed to load AT Protocol posts:", err);
    statusEl.innerHTML =
      'Couldn\'t load posts automatically right now. Read the blog directly on <a href="https://mptouzel.leaflet.pub/">Leaflet</a> instead.';
  }
})();
</script>
